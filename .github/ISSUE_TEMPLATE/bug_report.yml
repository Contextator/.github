name: Bug report
description: Something does not work the way it says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. An issue is public the moment it is filed; the [security policy](https://github.com/Contextator/.github/blob/main/SECURITY.md) says where a report goes instead.
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I have searched the existing issues and this bug has not been reported yet.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps you can get it down to.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit you are running.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: How it is deployed — the container image, a local development run, something else — say which.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the lines around the failure rather than the whole file, and check them for tokens, URLs and document contents before you do.
      render: text
    validations:
      required: false
